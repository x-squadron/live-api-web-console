services:
  backend-ts:
    build:
      context: .
    container_name: faktions-backend-ts
    env_file:
      - .env
    ports:
      - "${PORT:-3001}:3001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${PORT:-3001}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s


